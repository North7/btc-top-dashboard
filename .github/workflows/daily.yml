name: daily-update

on:
  # 主要觸發：外部定時服務（cron-job.org）每天 UTC 00:15 呼叫 workflow_dispatch（GitHub 排程實測常延遲約 5 小時）
  workflow_dispatch:
  # 備援：GitHub 自身排程；當天已更新就略過
  schedule:
    - cron: "15 0 * * *"
    - cron: "30 0 * * *"
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: 檢查今天是否已更新（排程觸發才會略過；手動或外部觸發一律執行）
        id: chk
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && git log -30 --format=%s | grep -qx "data: daily update $(date -u +%Y-%m-%d)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天已更新，備援排程略過"
          fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.chk.outputs.skip != 'true'

      - name: 抓取數據並計算分數
        if: steps.chk.outputs.skip != 'true'
        run: python run.py

      - name: Commit 更新
        if: steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            git push
          fi
